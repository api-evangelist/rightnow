  title: Malformed request
  remediation: Fix invalid JSON, missing fields, or wrong content-type; do not retry.
- status: 401
  title: Invalid or missing API key
  remediation: Rotate the key at Settings > API Keys.
- status: 402
  title: Insufficient credits
  remediation: Top up at Settings > Cost.
- status: 403
  title: Request not allowed (scope, plan, or paid-feature gate)
  remediation: Switch to a workspace key, upgrade the plan, or contact support.
- status: 404
  title: Pipeline or model does not exist
  remediation: Check the resource ID at Deployments.
- status: 409
  title: Idempotency conflict
  remediation: Reuse of an Idempotency-Key with a different body; use a new key for a different request.
- status: 422
  title: Cannot process safely / response too large to replay
  remediation: Use a new Idempotency-Key only when you intend a new inference request.
- status: 429
  title: Rate limit exceeded
  remediation: Respect the Retry-After header and back off exponentially.
- status: 500
  title: Server error
  remediation: Retry once with backoff; capture X-Request-Id if persistent.
- status: 502
  title: Bad gateway (upstream serving backend failed)
  remediation: Retry once; inspect deployment health.
- status: 503
  title: Service unavailable (stopped, provisioning, or at capacity)
  remediation: Respect the Retry-After header.
- status: 504
  title: Gateway timeout
  remediation: Switch to streaming or lower max_tokens.
