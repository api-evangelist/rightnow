aid: rightnow
name: RightNow AI
description: >-
  RightNow AI (RunInfra) turns plain-English descriptions of an inference
  workload into production, OpenAI-compatible AI endpoints. The platform
  selects open-source models from Hugging Face, benchmarks GPU options,
  applies kernel optimizations (quantization, speculative decoding, KV-cache
  tuning, Forge kernels), and deploys serverless, pay-per-token inference
  APIs on RunInfra Cloud, RunPod, Modal, or self-hosted GPUs. Its REST API is
  OpenAI-shaped and covers chat completions, responses, embeddings, rerank,
  image generation, audio speech and transcription, and model listing. A
  Y Combinator-backed research lab, RightNow AI also publishes open-source
  GPU-kernel and inference tooling.
